[project]
name = "autoparts-rag"
version = "0.1.0"
description = "RAG-асистент підтримки для магазину автозапчастин (етап 1: прототип + eval)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "pillow>=11",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk>=2.4",
    "reportlab>=4.2",
    "typer>=0.13",
    "numpy>=2",
]

[project.scripts]
rag = "autoparts_rag.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoparts_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: потребує запущеної БД і локальних моделей"]
addopts = "-m 'not integration'"
