# Evals у CI (розділ 9 підготовки до заняття 9).
# Кожен pull request, що чіпає код, промпти, тестсет або PDF, проходить два кроки:
#   1. checks: тести, індекс з data/pdfs і lint тестсету. Без ключа, безкоштовно.
#   2. evals:  повний eval з повторами і gate проти eval/baseline.json. Якщо метрика впала
#              понад допуск або кейс, що проходив, тепер падає, PR стає червоним.
# Ключ додайте в Settings -> Secrets and variables -> Actions як ANTHROPIC_API_KEY.
# Локальний прогін 53 питання x 3 коштував $0.37 (звіт 20261109-113120-v1).
# Швидкість: на CPU раннера GitHub одне питання займає близько 20 с (перший запуск, 9 листопада 2026),
# тому на PR іде один прогін (~20 хв), а прогін з повторами для pass@1 і flaky запускається вручну.
name: evals

on:
  pull_request:
    paths:
      - "src/**"
      - "eval/questions.jsonl"
      - "eval/baseline.json"
      - "data/pdfs/**"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      repeat:
        description: "Скільки разів прогнати кожне питання (3 = pass@1, flaky)"
        default: "3"

# новий пуш у той самий PR скасовує попередній прогін, щоб не платити двічі
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5444/rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Unit tests (no DB, no LLM)
        id: tests
        run: uv run --group dev pytest -q
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-reranker-v2-m3
      - name: OCR for the scanned PDF
        run: sudo apt-get update -q && sudo apt-get install -yq tesseract-ocr tesseract-ocr-ukr
      - name: Build the index from data/pdfs
        run: uv run rag migrate && uv run rag ingest
      - name: Lint the testset
        run: |
          set -o pipefail
          uv run rag lint 2>/dev/null | tee lint.txt
      - name: Checks in the job summary
        if: always()
        run: |
          { echo '## Checks'; echo; echo "- Тести: ${{ steps.tests.outcome }}"; echo "- Lint тестсету: $(tail -1 lint.txt 2>/dev/null || echo 'не дійшов')"; } >> "$GITHUB_STEP_SUMMARY"

  evals:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5444/rag
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-reranker-v2-m3
      - run: sudo apt-get update -q && sudo apt-get install -yq tesseract-ocr tesseract-ocr-ukr
      - run: uv run rag migrate && uv run rag ingest
      - name: Eval and the gate
        # latency не порівнюємо: baseline знято на іншій машині, а раннер GitHub повільніший.
        # Якість, ціна й токени від машини не залежать, їх gate перевіряє.
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          uv run rag eval --repeat "$REPEAT" --tag "ci-${{ github.run_number }}" --gate --skip latency 2>&1 \
            | grep --line-buffered -v -i -E "warn|Loading weights|self.dim|^\s*$" | tee eval-output.txt
      - name: Report in the job summary
        if: always()
        run: |
          if ls eval/reports/2*.json > /dev/null 2>&1; then
            uv run rag summary --skip latency 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '## ❌ Eval не дійшов до звіту'; echo '```'; tail -40 eval-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
